name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U testuser -d app_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    env:
      DATABASE_URL: postgres://testuser:testpass@localhost:5432/app_test?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      JWT_SECRET: ci-only-test-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - run: go run cmd/migration/main.go up
      - run: go test -race -timeout=5m ./...
      - name: Verify Linux target binaries
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/server-amd64 ./cmd/server
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /tmp/server-arm64 ./cmd/server
